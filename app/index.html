<style>
/* VOICE: 조용하고 품격 있게, 읽기보다 누르는 화면
   IDEA: 가죽 장정 수첩 — 아이보리 내지, 숲녹색 표지, 금박 한 줄
   PICTURE: 7칸 고리로 채워지는 노트, 금테 두른 큰 마이크
   COLOUR and TYPE: 아이보리, 숲녹색, 금색 / 나눔명조 제목 + 노토 산스
   LAYOUT: 한 손 폭 앱, 화면마다 할 일 하나, 아래 탭 */
:root{color-scheme:light dark;--bg:light-dark(#F4F0E8,#0E1312);--paper:light-dark(#FBF9F4,#151B1A);--ink:light-dark(#1A1F1E,#ECE7DC);--soft:light-dark(#575D5B,#A8AFAC);--line:light-dark(#DDD4C4,#28312F);--forest:#1C3632;--teal:light-dark(#1E3A36,#A9CFC7);--gold:light-dark(#9A7A42,#CBAE74);--goldsoft:#C9A96E;--mint:light-dark(#E7ECE8,#1B2A27);--warn:light-dark(#7A5A24,#D9BE86);--warnbg:light-dark(#F3ECDD,#2A2419);--red:light-dark(#9E2A1F,#FF9A8F);--redbg:light-dark(#F8E8E4,#3A1F1B)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.65 'Noto Sans KR',system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
h1,h2{font-family:'Nanum Myeongjo',serif;font-weight:800;line-height:1.35;letter-spacing:-.01em;margin:0;text-wrap:balance}h1{font-size:28px}h2{font-size:22px}
p{margin:0}button{font-family:inherit}
.app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.top{padding:14px 18px;display:flex;align-items:center;gap:10px;background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:4}
.top b{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:19px}
.ibtn{margin-left:auto;min-width:48px;min-height:48px;border:1px solid var(--line);background:transparent;border-radius:50%;display:grid;place-items:center;color:var(--teal);cursor:pointer;text-decoration:none}
main{flex:1;padding:22px 18px 28px;display:flex;flex-direction:column;gap:18px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:14px}
.card.forest{background:var(--forest);border-color:rgba(201,169,110,.45);color:#F4F0E8}
.lab{font-size:14px;font-weight:500;letter-spacing:.04em;color:var(--gold)}.forest .lab{color:var(--goldsoft)}
.muted{color:var(--soft);font-size:16px}
.btn{min-height:56px;padding:0 20px;border-radius:6px;border:0;font:500 18px 'Noto Sans KR',sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;color:var(--ink);text-decoration:none}
.btn.pri{background:var(--forest);color:#F4F0E8;box-shadow:inset 0 0 0 1px var(--goldsoft)}.forest .btn.pri{background:var(--goldsoft);color:#1A1F1E;box-shadow:none}
.btn.out{background:transparent;border:1px solid var(--gold)}.btn.ghost{background:transparent;color:var(--soft);font-size:16px;min-height:48px}
.btn:disabled{opacity:.5;cursor:default}
:is(button,a,input,textarea):focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.row{display:flex;gap:10px}.row>*{flex:1}
input,textarea{font:17px 'Noto Sans KR',sans-serif;min-height:56px;padding:12px 14px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
textarea{resize:vertical}
label{display:grid;gap:8px;font-weight:500}
nav.tabs{position:sticky;bottom:0;z-index:4;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--paper);border-top:1px solid var(--line)}
nav.tabs a{min-height:68px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:14px;color:var(--soft);text-decoration:none;border-top:2px solid transparent;position:relative}
nav.tabs a[aria-current=page]{color:var(--teal);font-weight:700;border-top-color:var(--gold)}
nav.tabs .dot{position:absolute;top:10px;left:calc(50% + 8px);min-width:18px;height:18px;border-radius:9px;background:var(--gold);color:#1A1F1E;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
/* home */
.hello{display:flex;align-items:center;gap:18px}
.ring{position:relative;width:118px;height:118px;flex:none}.ring svg{width:100%;height:100%}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:'Nanum Myeongjo',serif;font-size:26px}
.ring{overflow:hidden}.ring small{position:absolute;bottom:26px;left:0;right:0;text-align:center;font-size:11px;color:var(--soft)}
.q{font-family:'Nanum Myeongjo',serif;font-size:23px;font-weight:700;line-height:1.55}
.mood{display:flex;gap:10px}.mood button{flex:1;min-height:64px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-size:16px;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.mood button[aria-pressed=true]{border-color:var(--gold);background:var(--mint)}
.stat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));text-align:center}.stat div{border-right:1px solid var(--line)}.stat div:last-child{border:0}
.stat b{display:block;font-family:'Nanum Myeongjo',serif;font-size:26px}.stat span{font-size:14px;color:var(--soft)}
/* talk */
.chat{display:flex;flex-direction:column;gap:12px;flex:1}
.b{max-width:86%;padding:12px 16px;border-radius:14px;font-size:17px;line-height:1.6;white-space:pre-wrap}
.b.ai{align-self:flex-start;background:var(--paper);border:1px solid var(--line);border-top-left-radius:3px}
.b.me{align-self:flex-end;background:var(--forest);color:#F4F0E8;border-top-right-radius:3px}
.b.ai.last{font-family:'Nanum Myeongjo',serif;font-weight:700;font-size:21px;border-color:var(--gold)}
.chip{align-self:center;color:var(--gold);border:1px solid var(--gold);border-radius:999px;padding:4px 14px;font-size:14px;display:flex;align-items:center;gap:6px}
.alert{background:var(--redbg);color:var(--red);border-left:3px solid var(--red);border-radius:6px;padding:14px 16px;font-size:17px;display:grid;gap:12px}
.alert .call{background:var(--red);color:var(--paper);border:0;justify-content:center;font-size:20px;min-height:56px;text-decoration:none}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cmp div{border:1px solid var(--line);border-radius:8px;padding:12px;font-size:18px;display:grid;gap:4px}.cmp span{font-size:13px;color:var(--soft)}.cmp div:last-child{border-color:var(--gold)}
.think{align-self:flex-start;display:flex;gap:6px;padding:14px 16px}.think i{width:8px;height:8px;border-radius:50%;background:var(--gold);animation:bl 1s infinite}.think i:nth-child(2){animation-delay:.2s}.think i:nth-child(3){animation-delay:.4s}
@keyframes bl{50%{opacity:.2}}
.dock{position:sticky;bottom:68px;background:linear-gradient(transparent,var(--bg) 24%);padding:26px 0 8px;display:flex;flex-direction:column;align-items:center;gap:10px}
.mic{width:96px;height:96px;border-radius:50%;border:0;background:var(--forest);box-shadow:0 0 0 5px var(--bg),0 0 0 6px var(--goldsoft);display:grid;place-items:center;cursor:pointer;color:#F4F0E8}
.mic.on{background:var(--red);box-shadow:0 0 0 5px var(--bg),0 0 0 6px var(--red)}
.wave{display:flex;align-items:center;gap:4px;height:34px;width:160px}.wave i{flex:1;background:var(--gold);border-radius:2px;height:12%}
.wave.on i{animation:w 1s ease-in-out infinite}@keyframes w{50%{height:100%}}
.miclab{font-size:16px;color:var(--soft)}
.typer{width:100%;display:flex;gap:8px}.typer textarea{min-height:56px;flex:1}
/* note */
.mods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mod{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px 14px;display:grid;gap:10px;justify-items:center;text-align:center;cursor:pointer;color:var(--ink);text-decoration:none;position:relative}
.mod b{font-size:16px;font-weight:500}.mod .mini{width:64px;height:64px;position:relative}.mod .mini svg{width:100%;height:100%}.mod .mini span{position:absolute;inset:0;display:grid;place-items:center;color:var(--teal)}
.mod.locked{background:transparent;border-style:dashed}.mod .pct{font-size:13px;color:var(--soft)}
.item{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:4px}
.item .f{font-size:14px;color:var(--soft);display:flex;gap:8px;align-items:center;flex-wrap:wrap}.item .v{font-size:18px}
.badge{font-size:12px;border-radius:999px;padding:0 9px;border:1px solid}.badge.y{color:var(--teal)}.badge.n{color:var(--gold)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:15px;color:var(--soft);cursor:pointer;min-height:44px}
.sw input{appearance:none;width:52px;height:30px;min-height:30px;border-radius:15px;background:var(--line);position:relative;cursor:pointer;padding:0;border:0;flex:none}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.sw input:checked{background:var(--forest)}.sw input:checked::after{left:25px}
/* check */
.pager{display:flex;justify-content:center;gap:6px}.pager i{width:8px;height:8px;border-radius:50%;background:var(--line)}.pager i.on{background:var(--gold);width:22px;border-radius:4px}
.big{font-family:'Nanum Myeongjo',serif;font-size:26px;font-weight:700;line-height:1.5}
.banner{background:var(--warnbg);color:var(--warn);border-left:2px solid var(--gold);border-radius:6px;padding:12px 14px;font-size:15px}
.steps{display:flex;gap:6px;justify-content:center}.steps i{width:28px;height:4px;border-radius:2px;background:var(--line)}.steps i.on{background:var(--gold)}
.empty{text-align:center;display:grid;gap:14px;justify-items:center;padding:30px 10px}
.hide{display:none!important}
html.fs1{zoom:1.12}html.fs2{zoom:1.25}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.seg button{min-height:56px;border:1px solid var(--line);background:var(--paper);border-radius:10px;font:inherit;color:var(--ink);cursor:pointer}.seg button[aria-pressed=true]{background:var(--forest);color:#F4F0E8;border-color:var(--forest)}
.seg button:nth-child(2){font-size:1.12em}.seg button:nth-child(3){font-size:1.25em}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;background:var(--forest);color:#F4F0E8;padding:12px 20px;border-radius:999px;font-size:16px;z-index:9;box-shadow:0 6px 20px rgba(0,0,0,.18)}
#printArea{display:none}
@media print{
  body{background:#fff!important;color:#000}.toast{display:none!important}
  .app>*:not(#printArea){display:none!important}
  #printArea{display:block!important;font:12pt/1.6 'Noto Sans KR',sans-serif;color:#000}
  #printArea h1{font:800 22pt/1.3 'Nanum Myeongjo',serif;margin:0 0 4pt}
  #printArea h2{font:700 14pt/1.4 'Nanum Myeongjo',serif;border-bottom:1.5pt solid #1C3632;padding-bottom:3pt;margin:16pt 0 6pt;break-after:avoid}
  #printArea table{width:100%;border-collapse:collapse}#printArea td{border-bottom:.5pt solid #bbb;padding:4pt 6pt;vertical-align:top}#printArea td:first-child{width:28%;color:#444}
  #printArea .pn{font-size:10pt;color:#555}#printArea section{break-inside:avoid}
  @page{margin:16mm}
}
.flow{display:grid;gap:10px}.fstep{display:flex;gap:12px;align-items:flex-start}.fstep .no{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:14px;color:var(--soft)}
.fstep.done .no{background:var(--forest);color:#F4F0E8;border-color:var(--forest)}.fstep.now .no{border-color:var(--gold);color:var(--gold)}
.wish{border:1px solid var(--line);border-top:3px solid var(--forest);border-radius:6px;padding:18px;display:grid;gap:10px;background:var(--bg)}
.wgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.wgrid span{display:block;font-size:13px;color:var(--soft)}
.vend{display:grid;gap:8px}.vend label{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:12px;font-weight:400;cursor:pointer}.vend input{width:22px;min-height:22px;height:22px;accent-color:var(--forest)}
.vend b{font-weight:500}.vend small{color:var(--soft);display:block}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
h1,h2,h3,p,li,label,.q,.big{word-break:keep-all;overflow-wrap:anywhere}h1,h2,h3,.q{text-wrap:balance}
</style>

function webDict(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return null;

    r.onresult=e=>{let fin='',mid='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)fin+=t;else mid+=t}if(mid)cb.p({text:mid});if(fin)cb.f({text:fin})};
    r.onend=()=>{if(want){try{r.start();return}catch(_){}}cb.s({state:'idle'})};
    r.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){want=false;cb.s({state:'idle'});dict=null;typing=true;toast('마이크를 쓸 수 없어 글로 받을게요');if((location.hash||'')==='#talk')talk()}};

    stop(){want=false;return new Promise(ok=>{if(!rec)return ok();const r=rec;r.onend=()=>{cb.s({state:'idle'});ok()};try{r.stop()}catch(_){ok()}setTimeout(ok,1500)})},
    onPartial(f){cb.p=f},onFinal(f){cb.f=f},onState(f){cb.s=f}}}

  if(!pf){say(`${n}, ${THANKS[S.days.length%THANKS.length]} 오늘 이야기는 여기까지 해도 좋아요.`);return}

  let value=(/^(없어|없다|없음|없습니다|없어요|안\s?했|안\s?해)/.test(t)?'없음':t).slice(0,200);
  if(LOC.has(pf.field))value=value.replace(/\d{5,}/g,'[번호 가림]');
  const ex=S.items.find(i=>i.module===pf.module&&i.field===pf.field);
  if(ex&&ex.status==='확정'&&!similar(ex.value,value))ex.pending={value,quote:t.slice(0,200),at:today()};
  else if(ex){ex.value=value;ex.quote=t.slice(0,200);ex.at=today()}
  else S.items.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),module:pf.module,field:pf.field,value,quote:t.slice(0,200),certainty:'확실',status:'미확인',visible:false,at:today()});
  push('chip',`${m.name} · ${pf.field}에 적었어요`);
  const nx=candidates().find(c=>c.field!==pf.field)||null;setPending(nx);
  say(`${THANKS[(S.items.length+S.days.length)%THANKS.length]} ${nx?QB[nx.field]:'오늘 준비한 질문은 다 했어요. 일요일에 확인 탭에서 한 번만 봐 주세요.'}`)}

  document.querySelectorAll('input[name=vd]').forEach(r=>r.onchange=()=>{const v=VENDORS.find(x=>x.id===r.value);$('pkt').innerHTML='<b style="font-weight:500;color:var(--ink)">이 업체에 가는 항목</b><br>'+packet(v).map(([k,val])=>esc(k)+': '+esc(val)).join('<br>')});
  if($('areset'))$('areset').onclick=()=>{S.after=null;re()};
}
window.addEventListener('hashchange',()=>{if(location.hash==='#check')ci=0;render();window.scrollTo(0,0)});
(async()=>{
  const timer=setTimeout(()=>{if(!loaded){loaded=true;render()}},10000);
  const local=()=>{try{const l=localStorage.getItem('nanal');if(l)S=Object.assign(blank(),JSON.parse(l))}catch(_){}};
  try{
    if(window.claude&&claude.use){
      const [db,u,s,di,t]=await Promise.all(['db','user','sample','dictation','tts'].map(n=>claude.use(n).catch(()=>null)));
      sample=s;dict=di;tts=t;wireDict();
      const uid=u?await u.id():null;
      if(db&&uid){ref=db.doc('data/users/'+uid+'/nanal');const snap=await ref.get();if(snap.exists)S=Object.assign(blank(),snap.data())}else local();
    }else local();
  }catch(e){}
  if(!dict)dict=webDict();if(!tts)tts=webTts();wireDict();
  if(!S.profile.since)S.profile.since=S.days[0]||today();if(!S.asked)S.asked=[];S.v=3;applyFs();
  clearTimeout(timer);loaded=true;render();
})();
}
