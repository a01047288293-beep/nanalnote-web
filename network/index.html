<style>
:root{color-scheme:light;--bg:#F4F0E8;--paper:#FBF9F4;--ink:#1A1F1E;--soft:#575D5B;--line:#DDD4C4;--forest:#1C3632;--gold:#C9A96E;--goldd:#9A7A42;--mint:#E7ECE8}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:400 17px/1.6 'Noto Sans KR',system-ui,sans-serif;word-break:keep-all;display:flex;flex-direction:column}
header{background:var(--forest);color:#F4F0E8;padding:12px 18px;display:flex;align-items:center;gap:14px}
header a{color:inherit;text-decoration:none}header .t{margin-left:auto;font-size:15px;opacity:.85}
.nlogo{width:auto;display:block}
.wrap{flex:1;display:grid;grid-template-columns:400px 1fr;min-height:0}
.side{order:-1;display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--paper)}
.ctl{padding:16px;display:grid;gap:12px;border-bottom:1px solid var(--line)}
h1{font:800 24px/1.3 'Nanum Myeongjo',serif;margin:0}
.sub{color:var(--soft);font-size:15px;margin:0}
.loc{display:flex;gap:8px}
.loc input{flex:1;min-height:50px;border:1px solid var(--line);border-radius:10px;padding:0 14px;font:inherit;background:#fff}
.btn{min-height:50px;border-radius:10px;border:1px solid var(--forest);background:var(--forest);color:#F4F0E8;font:500 16px 'Noto Sans KR',sans-serif;padding:0 14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn.out{background:transparent;color:var(--forest)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font:inherit;font-size:15.5px;cursor:pointer;color:var(--ink);display:flex;gap:6px;align-items:center}
.groups{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.gtab{min-height:46px;border:1px solid var(--line);background:#fff;border-radius:10px;font:500 16px 'Noto Sans KR',sans-serif;cursor:pointer;color:var(--ink)}.gtab[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:#1A1F1E}
.chip[aria-pressed=true]{background:var(--forest);color:#F4F0E8;border-color:var(--forest)}
.why{font-size:14.5px;color:var(--goldd);margin:0;min-height:1.4em}
.list{overflow:auto;flex:1;padding:8px 16px 24px}
.item{border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px 14px 12px;margin-top:10px;display:grid;gap:6px;cursor:pointer}
.item.on{border-color:var(--gold);box-shadow:0 0 0 2px rgba(201,169,110,.35)}
.item b{font-size:18px;font-weight:700}
.item .meta{font-size:14px;color:var(--soft)}
.item .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.item .acts a{font-size:15px;min-height:42px;padding:0 12px;border-radius:8px}
.dist{float:right;font-size:14px;color:var(--goldd);font-weight:500}
.more{margin-top:12px;width:100%}
.empty{color:var(--soft);text-align:center;padding:30px 10px}
#map{width:100%;height:100%;min-height:300px;background:var(--mint)}
.note{font-size:13.5px;color:var(--soft);padding:12px 16px;border-top:1px solid var(--line);margin:0}
.fallback{padding:16px;display:grid;gap:10px}
.fallback a{justify-content:flex-start}
@media (max-width:820px){.wrap{grid-template-columns:1fr;grid-template-rows:42vh auto}.side{order:2;border-right:0}#map{order:1;min-height:0}.list{overflow:visible}body{display:block}.wrap{display:flex;flex-direction:column}#map{height:42vh;position:sticky;top:0;z-index:2}}

  $('list').innerHTML=results.map((p,i)=>{const tel=(p.phone||'').replace(/[^0-9-]/g,'');
    return`<div class="item" data-i="${i}" tabindex="0"><span class="dist">${p.distance?km(p.distance):''}</span><b>${esc(p.place_name)}</b>
    <span class="meta">${esc((p.category_name||'').split(' > ').slice(-1)[0])} · ${esc(p.road_address_name||p.address_name)}</span>
    <div class="acts">${tel?`<a class="btn" href="tel:${tel}">📞 전화</a>`:''}<a class="btn out" href="https://map.kakao.com/link/to/${encodeURIComponent(p.place_name)},${p.y},${p.x}" target="_blank" rel="noopener">길찾기</a>${/^https:\/\//.test(p.place_url||'')?`<a class="btn out" href="${esc(p.place_url)}" target="_blank" rel="noopener">자세히</a>`:''}${cat.x?`<a class="btn out" href="${cat.x[1]}" ${cat.x[1].startsWith('tel:')?'':'target="_blank" rel="noopener"'}>${esc(cat.x[0])}</a>`:''}</div></div>`}).join('')+
   (page&&page.hasNextPage?'<button class="btn out more" id="more">더 보기</button>':'');
  $('list').querySelectorAll('.item').forEach(el=>{el.onclick=e=>{if(e.target.closest('a'))return;focus(+el.dataset.i,false)};el.onkeydown=e=>{if(e.key==='Enter')focus(+el.dataset.i,false)}});
  const mb=$('more');if(mb)mb.onclick=()=>search(true);
}
let iw;
function focus(i,fromMap){const p=results[i];if(!p)return;
  document.querySelectorAll('.item.on').forEach(x=>x.classList.remove('on'));const el=document.querySelector(`.item[data-i="${i}"]`);if(el){el.classList.add('on');if(fromMap)el.scrollIntoView({block:'nearest',behavior:'smooth'})}
  const pos=new kakao.maps.LatLng(p.y,p.x);map.panTo(pos);
  if(iw)iw.close();iw=new kakao.maps.InfoWindow({content:`<div style="padding:6px 10px;font:14px 'Noto Sans KR',sans-serif;white-space:nowrap">${esc(p.place_name)}</div>`});iw.open(map,markers[i])}
function setCenter(lat,lng,label){center={lat,lng,label};map.setCenter(new kakao.maps.LatLng(lat,lng));search(false)}

function boot(){
  map=new kakao.maps.Map($('map'),{center:new kakao.maps.LatLng(DEFAULT.lat,DEFAULT.lng),level:6});
  map.addControl(new kakao.maps.ZoomControl(),kakao.maps.ControlPosition.RIGHT);
  ps=new kakao.maps.services.Places();geo=new kakao.maps.services.Geocoder();
  $('chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;cat=CATS.find(c=>c.k===b.dataset.k);drawChips();history.replaceState(null,'','?c='+cat.k);search(false)};
  $('groups').onclick=e=>{const b=e.target.closest('.gtab');if(!b)return;cat=GROUPS.find(g=>g.k===b.dataset.g).cats[0];drawChips();history.replaceState(null,'','?c='+cat.k);search(false)};
  const find=()=>{const v=$('q').value.trim();if(!v)return;
    geo.addressSearch(v,(r,s)=>{if(s===kakao.maps.services.Status.OK&&r[0])return setCenter(+r[0].y,+r[0].x,v);
      ps.keywordSearch(v,(d,s2)=>{if(s2===kakao.maps.services.Status.OK&&d[0])setCenter(+d[0].y,+d[0].x,v);else $('list').innerHTML='<p class="empty">그 지역을 찾지 못했어요. "광주 남구"처럼 적어 주세요.</p>'})})};
  $('go').onclick=find;$('q').onkeydown=e=>{if(e.key==='Enter')find()};
  $('me').onclick=()=>{if(!navigator.geolocation){$('why').textContent='이 기기에서는 위치를 쓸 수 없어요. 지역을 적어 주세요.';return}
    $('why').textContent='위치를 찾는 중…';navigator.geolocation.getCurrentPosition(p=>setCenter(p.coords.latitude,p.coords.longitude,'지금 계신 곳'),()=>{$('why').textContent='위치 사용을 허락하지 않으셨어요. 지역을 적어 주세요.'},{timeout:10000,maximumAge:300000})};
  search(false);
}
if(!KAKAO_KEY)fallback();
else{const s=document.createElement('script');s.src='https://dapi.kakao.com/v2/maps/sdk.js?appkey='+KAKAO_KEY+'&libraries=services&autoload=false';
  s.onload=()=>{try{kakao.maps.load(boot)}catch(e){fallback()}};s.onerror=fallback;document.head.appendChild(s);
  setTimeout(()=>{if(!map)fallback()},8000)}
</script>
</body>
</html>
